<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能问答助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .main-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            height: calc(100vh - 40px);
            overflow: hidden;
        }

        /* 顶部标题栏 - 精简 */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 500;
        }

        .header-assistant {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.3);
            background: #fff;
        }

        .assistant-avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .status-badge {
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
        }

        /* 聊天区域 */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* 对话气泡 */
        .message {
            display: flex;
            gap: 12px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
        }

        .message.assistant .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        .message-content {
            max-width: 75%;
        }

        .message-bubble {
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.6;
            font-size: 15px;
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-bubble {
            background: #f1f3f5;
            color: #333;
            border-bottom-left-radius: 4px;
        }

        /* 语音控制按钮 - 在回答气泡下方 */
        .audio-controls {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        /* 相关问题推荐 */
        .recommendations {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px dashed #e0e0e0;
        }

        .recommendations-title {
            font-size: 12px;
            color: #888;
            margin-bottom: 6px;
        }

        .recommendation-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .recommendation-tag {
            background: #f0f4ff;
            color: #667eea;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            cursor: pointer;
            border: 1px solid #d0d8ff;
            transition: all 0.2s;
        }

        .recommendation-tag:hover {
            background: #667eea;
            color: white;
        }

        .control-btn {
            padding: 6px 14px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s ease;
        }

        .control-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-play {
            background: #e0e7ff;
            color: #667eea;
        }

        .btn-pause {
            background: #fef3c7;
            color: #f59e0b;
        }

        .btn-stop {
            background: #fee2e2;
            color: #ef4444;
        }

        .control-btn:hover:not(:disabled) {
            transform: scale(1.05);
        }

        /* 加载状态 */
        .loading {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #6b7280;
            font-size: 14px;
            padding: 10px 0;
        }

        .loading-dots {
            display: flex;
            gap: 4px;
        }

        .loading-dots span {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* 输入区域 */
        .input-section {
            padding: 15px 20px;
            background: #fafafa;
            border-top: 1px solid #eee;
        }

        /* 快捷问题 - 紧贴输入框上方 */
        .quick-questions-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .quick-questions-title {
            font-size: 14px;
            color: #667eea;
            font-weight: 600;
        }
        .quick-pagination {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .page-btn {
            padding: 4px 12px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .page-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        .page-info {
            font-size: 12px;
            color: #666;
            min-width: 40px;
            text-align: center;
        }
        .quick-questions-container {
            margin-bottom: 12px;
            overflow: hidden;
        }
        .quick-questions-scroll {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 200px;
            overflow-y: auto;
            padding-right: 8px;
            scrollbar-width: thin;
            scrollbar-color: #667eea #f0f0f0;
        }
        .quick-questions-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .quick-questions-scroll::-webkit-scrollbar-track {
            background: #f0f0f0;
            border-radius: 3px;
        }
        .quick-questions-scroll::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 3px;
        }

        .quick-btn {
            padding: 8px 16px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 20px;
            font-size: 13px;
            color: #555;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .quick-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
        }

        .input-box {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #e5e7eb;
            border-radius: 25px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .input-box:focus {
            border-color: #667eea;
        }

        .send-btn {
            padding: 14px 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .send-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* 相关问题推荐 */
        .recommendations {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }

        .recommend-title {
            font-size: 13px;
            color: #888;
            margin-bottom: 6px;
            width: 100%;
        }

        .recommend-btn {
            padding: 6px 14px;
            background: #fef3c7;
            border: none;
            border-radius: 15px;
            font-size: 13px;
            color: #92400e;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .recommend-btn:hover {
            background: #fde68a;
        }

        /* 头像张嘴/闭嘴状态 */
        .avatar-mouth-open {
            display: none;
        }

        .avatar-wrapper.speaking .avatar-mouth-closed {
            display: none;
        }

        .avatar-wrapper.speaking .avatar-mouth-open {
            display: block;
        }

        /* 响应式 */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            .main-container {
                border-radius: 12px;
                height: calc(100vh - 20px);
            }
            .message-content {
                max-width: 85%;
            }
            .header h1 {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- 顶部标题栏 -->
        <div class="header">
            <!-- 助手头像 -->
            <div class="header-assistant" id="headerAssistant">
                <img src="/static/avatar_closed.png" alt="助手" class="assistant-avatar" id="assistantAvatar">
            </div>
            <h1>医疗咨询助手</h1>
            <div class="status-badge">
                <span class="status-dot"></span>
                服务正常
            </div>
        </div>

        <!-- 聊天区域 -->
        <div class="chat-area" id="chatArea">
            <!-- 对话气泡会在这里动态生成 -->
        </div>

        <!-- 输入区域 -->
        <div class="input-section">
            <!-- 快捷问题列表（滚动显示） -->
            <div class="quick-questions-container">
                <div class="quick-questions-title">快捷问题</div>
                <div class="quick-questions-scroll" id="quickQuestions"></div>
            </div>
            
            <!-- 输入框 -->
            <div class="input-wrapper">
                <input type="text" class="input-box" id="questionInput" placeholder="输入您的问题..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" id="sendBtn" onclick="sendQuestion()">发送</button>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let currentPage = 0;
        let pageSize = 5;
        let totalPages = 3;
        let allQuestions = [];
        let currentAudio = null;
        let currentAudioUrl = null;
        let isPlaying = false;
        let isPaused = false;
        let currentPlayingMessageId = null;
        // 当前选中的问题
        let currentQuestion = null;
        // 每个消息独立的音频对象
        window.messageAudios = {};
        // 已发送的问题列表
        let sentQuestions = [];

        // HTML转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 属性转义
        function escapeAttr(str) {
            return str.replace(/'/g, "\\'").replace(/"/g, '\\"');
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadAllQuestions();
            updateSendButton();
        });

        // 加载所有快捷问题
        async function loadAllQuestions() {
            try {
                const response = await fetch(`/api/questions?page=0&page_size=100`);
                const data = await response.json();
                allQuestions = data.questions || [];
                renderQuickQuestions();
            } catch (error) {
                console.error('加载快捷问题失败:', error);
            }
        }

        // 渲染快捷问题
        function renderQuickQuestions() {
            const container = document.getElementById('quickQuestions');
            container.innerHTML = allQuestions.map((q, i) => {
                // 根据状态设置样式
                let style = 'background: white; color: #333;';
                if (sentQuestions.includes(q)) {
                    // 已发送：白底灰字
                    style = 'background: #f5f5f5; color: #999;';
                } else if (q === currentQuestion) {
                    // 当前选中：蓝底白字
                    style = 'background: #667eea; color: white;';
                }
                return `<button class="quick-btn" style="${style}" data-index="${i}" onclick="selectQuickQuestion(${i}, '${escapeAttr(q)}')">${escapeHtml(q)}</button>`
            }).join('');
        }

        // 选择快捷问题
        function selectQuickQuestion(index, question) {
            const btn = document.querySelector(`.quick-btn[data-index="${index}"]`);
            if (!btn) return;
            
            // 将之前选中的变为已点击状态（白底蓝字）
            if (currentQuestion) {
                document.querySelectorAll('.quick-btn').forEach(b => {
                    if (b.getAttribute('data-question') === currentQuestion) {
                        b.style.background = '#f0f4ff';
                        b.style.color = '#667eea';
                    }
                });
            }
            
            // 当前选中的变为蓝色底白字
            btn.style.background = '#667eea';
            btn.style.color = 'white';
            btn.setAttribute('data-question', question);
            
            // 更新输入框
            document.getElementById('questionInput').value = question;
            currentQuestion = question;
            updateSendButton();
        }

        // 发送问题后重置样式
        function resetQuickQuestionStyles(question) {
            // 找到当前选中的按钮索引
            const currentIndex = allQuestions.indexOf(currentQuestion);
            
            // 所有按钮恢复白底黑字
            document.querySelectorAll('.quick-btn').forEach((btn, i) => {
                if (sentQuestions.includes(allQuestions[i])) {
                    // 已发送：白底灰字
                    btn.style.background = '#f5f5f5';
                    btn.style.color = '#999';
                } else {
                    // 未发送：白底黑字
                    btn.style.background = 'white';
                    btn.style.color = '#333';
                }
            });
            
            // 当前选中置空
            currentQuestion = null;
            
            // 添加到已发送列表
            if (!sentQuestions.includes(question)) {
                sentQuestions.push(question);
            }
            
            // 重新渲染以更新所有样式
            renderQuickQuestions();
        }

        // 更新发送按钮状态
        function updateSendButton() {
            const input = document.getElementById('questionInput');
            const btn = document.getElementById('sendBtn');
            btn.disabled = !input.value.trim();
        }

        // 输入监听
        document.getElementById('questionInput').addEventListener('input', updateSendButton);

        // 回车发送
        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendQuestion();
            }
        }

        // 是否正在发送中
        let isSending = false;

        // 发送问题
        async function sendQuestion() {
            // 防止重复发送
            if (isSending) return;
            
            const input = document.getElementById('questionInput');
            const question = input.value.trim();
            if (!question) return;

            // 标记为正在发送
            isSending = true;
            
            // 禁用发送按钮
            const sendBtn = document.getElementById('sendBtn');
            if (sendBtn) sendBtn.disabled = true;

            // 清空输入框
            input.value = '';
            updateSendButton();

            // 添加用户消息
            addMessage('user', question);
            
            // 重置快捷问题样式，已发送的变为灰字
            resetQuickQuestionStyles(question);

            // 显示思考中状态
            showThinkingStatus();

            try {
                // 并行调用问答API
                const response = await fetch('/api/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question })
                });
                
                const data = await response.json();

                // 移除思考状态
                removeThinkingStatus();

                if (data.success) {
                    // 先生成语音，等语音准备好后再显示答案
                    await prepareAudioAndShow(question, data.answer, data.source);
                } else {
                    addMessage('assistant', '抱歉，暂时无法回答您的问题。', 'error');
                }
            } catch (error) {
                removeThinkingStatus();
                console.error('发送问题失败:', error);
                addMessage('assistant', '网络错误，请稍后重试。', 'error');
            } finally {
                // 恢复发送状态
                isSending = false;
                const sendBtn = document.getElementById('sendBtn');
                if (sendBtn) sendBtn.disabled = false;
            }
        }

        // 显示思考中状态
        function showThinkingStatus() {
            const chatArea = document.getElementById('chatArea');
            const statusDiv = document.createElement('div');
            statusDiv.id = 'thinkingStatus';
            statusDiv.className = 'loading';
            statusDiv.innerHTML = `
                <span>正在思考中</span>
                <div class="loading-dots">
                    <span></span><span></span><span></span>
                </div>
            `;
            chatArea.appendChild(statusDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // 移除思考状态
        function removeThinkingStatus() {
            const el = document.getElementById('thinkingStatus');
            if (el) el.remove();
        }

        // 生成语音并显示答案
        async function prepareAudioAndShow(question, answer, source) {
            // 显示语音准备中
            showAudioPreparing();

            try {
                // 调用语音合成API
                const response = await fetch('/api/tts/url', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: answer })
                });
                const data = await response.json();

                // 移除语音准备中状态
                removeAudioPreparing();

                // 如果语音生成成功，先保存URL，再显示回答和自动播放
                if (data.success && data.audio_url) {
                    currentAudioUrl = data.audio_url;
                    // 显示文字回答并获取消息ID
                    const msgId = addMessage('assistant', answer, source, question);
                    // 自动播放
                    autoPlayAudio(data.audio_url, msgId);
                    // 获取并显示相关问题推荐
                    loadRecommendations(question, msgId);
                } else {
                    const msgId = addMessage('assistant', answer, source, question);
                    loadRecommendations(question, msgId);
                }
            } catch (error) {
                removeAudioPreparing();
                // 语音失败也显示文字
                const msgId = addMessage('assistant', answer, source, question);
                loadRecommendations(question, msgId);
            }
        }

        // 加载并显示相关问题推荐
        async function loadRecommendations(question, msgId) {
            try {
                const response = await fetch('/api/recommend', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question })
                });
                const data = await response.json();
                
                if (data.success && data.recommendations && data.recommendations.length > 0) {
                    const recsContainer = document.getElementById(`recs-${msgId}`);
                    if (recsContainer) {
                        const tagsContainer = recsContainer.querySelector('.recommendation-tags');
                        tagsContainer.innerHTML = data.recommendations.map(q => 
                            `<span class="recommendation-tag" onclick="selectQuickQuestionByText('${escapeAttr(q)}')">${escapeHtml(q)}</span>`
                        ).join('');
                        recsContainer.style.display = 'block';
                    }
                }
            } catch (error) {
                console.error('加载推荐失败:', error);
            }
        }

        // 根据文本选择问题 - 填充到输入框，不自动发送
        function selectQuickQuestionByText(questionText) {
            const input = document.getElementById('questionInput');
            input.value = questionText;
            updateSendButton();
            // 聚焦输入框，让用户可以修改或确认
            input.focus();
        }

        // 显示语音准备中
        function showAudioPreparing() {
            const chatArea = document.getElementById('chatArea');
            const statusDiv = document.createElement('div');
            statusDiv.id = 'audioPreparing';
            statusDiv.className = 'loading';
            statusDiv.innerHTML = `
                <span>语音准备中</span>
                <div class="loading-dots">
                    <span></span><span></span><span></span>
                </div>
            `;
            chatArea.appendChild(statusDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // 移除语音准备中
        function removeAudioPreparing() {
            const el = document.getElementById('audioPreparing');
            if (el) el.remove();
        }

        // 添加消息
        function addMessage(type, content, source, originalQuestion) {
            const chatArea = document.getElementById('chatArea');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            let messageId = null;

            if (type === 'user') {
                messageDiv.innerHTML = `
                    <div class="message-avatar">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                        </svg>
                    </div>
                    <div class="message-content">
                        <div class="message-bubble">${escapeHtml(content)}</div>
                    </div>
                `;
            } else {
                messageId = 'msg-' + Date.now();
                messageDiv.innerHTML = `
                    <div class="message-avatar">
                        <img src="/static/avatar_closed.png" alt="助手" class="message-avatar" style="width:40px;height:40px;border-radius:50%;object-fit:cover;">
                    </div>
                    <div class="message-content" data-message-id="${messageId}">
                        ${source ? `<div style="font-size:12px;color:#888;margin-bottom:6px;">来源: ${source === 'knowledge_base' ? '知识库' : source === 'llm' ? 'AI助手' : '其他'}</div>` : ''}
                        <div class="message-bubble" id="${messageId}">${escapeHtml(content)}</div>
                        <div class="audio-controls" id="controls-${messageId}">
                            <button class="control-btn btn-play" onclick="playAudio('${messageId}', '${escapeAttr(currentAudioUrl || '')}')">
                                <span>▶</span> 播放
                            </button>
                            <button class="control-btn btn-pause" onclick="pauseAudio()" style="display:none">
                                <span>⏸</span> 暂停
                            </button>
                            <button class="control-btn btn-stop" onclick="stopAudio()">
                                <span>⏹</span> 停止
                            </button>
                        </div>
                        <div class="recommendations" id="recs-${messageId}" style="display:none;">
                            <div class="recommendations-title">相关问题：</div>
                            <div class="recommendation-tags"></div>
                        </div>
                    </div>
                `;

                // 保存消息ID和音频URL的关联
                if (currentAudioUrl) {
                    window.audioMap = window.audioMap || {};
                    window.audioMap[messageId] = currentAudioUrl;
                }
            }

            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
            
            // 返回消息ID
            return messageId;
        }

        // 语音合成
        async function prepareAudio(question, answer) {
            try {
                const response = await fetch('/api/tts/url', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: answer })
                });
                const data = await response.json();

                if (data.success && data.audio_url) {
                    currentAudioUrl = data.audio_url;
                    // 自动播放（使用当前消息ID）
                    autoPlayAudio(data.audio_url, currentMessageId);
                }
            } catch (error) {
                console.error('语音合成失败:', error);
            }
        }

        // 自动播放音频（针对特定消息）
        function autoPlayAudio(url, messageId) {
            // 停止之前的音频
            if (currentAudio) {
                currentAudio.pause();
                // 更新之前的按钮状态
                if (currentPlayingMessageId) {
                    updateSingleButtonState(currentPlayingMessageId, false, false);
                }
            }
            
            // 创建新的音频对象
            const audio = new Audio(url);
            window.messageAudios[messageId] = audio;
            currentAudio = audio;
            currentAudioUrl = url;
            currentPlayingMessageId = messageId;
            
            // 播放时切换到张嘴头像
            setAvatarSpeaking(true);
            audio.play().then(() => {
                isPlaying = true;
                isPaused = false;
                updateSingleButtonState(messageId, true, false);
            }).catch(e => {
                console.log('自动播放被阻止:', e);
                setAvatarSpeaking(false);
                updateSingleButtonState(messageId, false, false);
            });
            
            // 播放结束时切换回闭嘴头像
            audio.onended = function() {
                isPlaying = false;
                isPaused = false;
                setAvatarSpeaking(false);
                updateSingleButtonState(messageId, false, false);
            };
        }
        
        // 切换头像状态
        function setAvatarSpeaking(speaking) {
            const avatar = document.getElementById('assistantAvatar');
            if (avatar) {
                avatar.src = speaking ? '/static/avatar_open.png' : '/static/avatar_closed.png';
            }
        }

        // 更新单个消息的按钮状态
        function updateSingleButtonState(messageId, playing, paused) {
            const container = document.querySelector(`[data-message-id="${messageId}"] .audio-controls`);
            if (!container) return;
            
            const playBtn = container.querySelector('.btn-play');
            const pauseBtn = container.querySelector('.btn-pause');
            
            if (playing && !paused) {
                // 正在播放：显示暂停按钮，隐藏播放按钮
                if (playBtn) playBtn.style.display = 'none';
                if (pauseBtn) pauseBtn.style.display = 'inline-flex';
            } else {
                // 暂停或停止：显示播放按钮，隐藏暂停按钮
                if (playBtn) playBtn.style.display = 'inline-flex';
                if (pauseBtn) pauseBtn.style.display = 'none';
            }
        }

        // 播放指定消息的音频
        function playAudio(messageId, url) {
            const audioUrl = window.audioMap?.[messageId] || url;
            if (!audioUrl) return;
            
            // 切换头像
            setAvatarSpeaking(true);
            
            // 检查是否已经存在该消息的音频对象
            let audio = window.messageAudios[messageId];
            
            if (audio) {
                // 复用已有音频对象（从暂停位置继续播放）
                currentAudio = audio;
            } else {
                // 创建新的音频对象并存储
                audio = new Audio(audioUrl);
                window.messageAudios[messageId] = audio;
                currentAudio = audio;
            }
            
            // 停止之前播放的音频（如果有且不是同一个）
            if (currentAudio && currentAudio !== audio) {
                currentAudio.pause();
                if (currentPlayingMessageId && currentPlayingMessageId !== messageId) {
                    updateSingleButtonState(currentPlayingMessageId, false, false);
                }
            }
            
            currentAudioUrl = audioUrl;
            currentPlayingMessageId = messageId;
            
            currentAudio.play().then(() => {
                isPlaying = true;
                isPaused = false;
                updateSingleButtonState(messageId, true, false);
            }).catch(e => {
                console.error('播放失败:', e);
                setAvatarSpeaking(false);
            });
            
            // 播放结束
            currentAudio.onended = function() {
                isPlaying = false;
                isPaused = false;
                setAvatarSpeaking(false);
                updateSingleButtonState(messageId, false, false);
            };
        }

        // 暂停音频
        function pauseAudio() {
            if (!currentAudio) return;
            
            if (isPaused) {
                // 继续播放
                currentAudio.play();
                isPaused = false;
                setAvatarSpeaking(true);
                updateSingleButtonState(currentPlayingMessageId, true, false);
            } else {
                // 暂停
                currentAudio.pause();
                isPaused = true;
                setAvatarSpeaking(false);
                updateSingleButtonState(currentPlayingMessageId, true, true);
            }
        }

        // 停止音频
        function stopAudio() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                isPlaying = false;
                isPaused = false;
                setAvatarSpeaking(false);
                updateSingleButtonState(currentPlayingMessageId, false, false);
            }
        }

    </script>
</body>
</html>
